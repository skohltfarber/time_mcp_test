name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm audit
        working-directory: web
        run: |
          npm install
          npm audit --audit-level=high

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: .NET vulnerability check
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/TimeMcp.Api/TimeMcp.Api.csproj
          dotnet list src/TimeMcp.Api/TimeMcp.Api.csproj package --vulnerable --include-transitive | tee /tmp/dotnet-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-vuln.txt; then
            echo "Vulnerable NuGet packages found in TimeMcp.Api."
            exit 1
          fi
