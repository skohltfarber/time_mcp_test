name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.1 detect --source /repo --verbose --redact

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit
        working-directory: web
        run: |
          npm install
          npm audit --audit-level=high

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: .NET vulnerability check
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/TimeMcp.Api/TimeMcp.Api.csproj
          dotnet list src/TimeMcp.Api/TimeMcp.Api.csproj package --vulnerable --include-transitive | tee /tmp/dotnet-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-vuln.txt; then
            echo "Vulnerable NuGet packages found in TimeMcp.Api."
            exit 1
          fi
