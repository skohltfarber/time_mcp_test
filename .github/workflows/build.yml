name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compose config and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web production build
        working-directory: web
        run: |
          npm install
          npm run build
