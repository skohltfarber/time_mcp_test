services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "5080:5080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

  worldclock:
    profiles: ["check"]
    build:
      context: .
      dockerfile: docker/worldclock.Dockerfile

  local:
    profiles: ["check"]
    build:
      context: .
      dockerfile: docker/local.Dockerfile
